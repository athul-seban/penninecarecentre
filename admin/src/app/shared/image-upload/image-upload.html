<div class="image-upload-wrapper">
  @if (error) {
    <div class="upload-error">{{ error }}</div>
  }

  @if (!value) {
    <label
      class="dropzone"
      [class.dragging]="isDragging"
      [class.uploading]="uploading"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
    >
      @if (uploading) {
        <span class="dropzone-text">Uploading…</span>
      } @else {
        <span class="dropzone-icon">⬆</span>
        <span class="dropzone-text">Drop a file here, or click to upload</span>
      }
      <input type="file" [accept]="accept" style="display:none"
        (change)="onFileSelected($event)" [disabled]="uploading" />
    </label>
  }

  @if (value) {
    <div class="img-thumb-row">
      <div class="img-thumb" (click)="openFullscreen()" title="Click to preview full size">
        @if (isVideo(value)) {
          <video
            [src]="previewUrl(value)"
            class="video-thumb-preview"
            muted
            preload="metadata"
          ></video>
          <span class="video-play-icon">▶</span>
        } @else {
          <img
            [src]="previewUrl(value)"
            alt="Preview"
            (error)="$any($event.target).style.display='none'"
            (load)="$any($event.target).style.display='block'"
          />
        }
        <span class="img-thumb-zoom">&#x26F6;</span>
      </div>
      <button type="button" class="btn-remove-img" (click)="remove()">✕ Remove</button>
    </div>
  }
</div>

@if (fullscreenImage) {
  <div class="fullscreen-overlay" (click)="closeFullscreen()">
    <button class="fullscreen-close" (click)="closeFullscreen()">✕</button>
    @if (isVideo(fullscreenImage)) {
      <video
        [src]="previewUrl(fullscreenImage)"
        controls
        autoplay
        class="fullscreen-video"
        (click)="$event.stopPropagation()"
      ></video>
    } @else {
      <img [src]="previewUrl(fullscreenImage)" alt="Full preview" (click)="$event.stopPropagation()" />
    }
  </div>
}

<div class="layout">
  <app-sidebar></app-sidebar>
  <div class="content">
    <div class="page-header">
      <div>
        <h1>My Account</h1>
        <p>Update your name, email and password &mdash; role: <strong>{{ role }}</strong></p>
      </div>
    </div>

    <div class="cards">
      <div class="card">
        <h2>Profile</h2>
        <form (ngSubmit)="saveProfile()">
          <div class="form-group">
            <label>Name</label>
            <input type="text" [(ngModel)]="profileForm.name" name="name" required />
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" [(ngModel)]="profileForm.email" name="email" required />
          </div>
          @if (profileError) {
            <div class="error">{{ profileError }}</div>
          }
          @if (profileSaved) {
            <div class="success">Profile updated.</div>
          }
          <div class="form-actions">
            <button type="submit" class="btn-primary" [disabled]="savingProfile">
              {{ savingProfile ? 'Saving...' : 'Save Profile' }}
            </button>
          </div>
        </form>
      </div>

      <div class="card">
        <h2>Change Password</h2>
        <form (ngSubmit)="savePassword()">
          <div class="form-group">
            <label>Current Password</label>
            <input type="password" [(ngModel)]="passwordForm.currentPassword" name="currentPassword" required />
          </div>
          <div class="form-group">
            <label>New Password</label>
            <input type="password" [(ngModel)]="passwordForm.newPassword" name="newPassword" minlength="8" required />
          </div>
          <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" [(ngModel)]="passwordForm.confirmPassword" name="confirmPassword" minlength="8" required />
          </div>
          @if (passwordError) {
            <div class="error">{{ passwordError }}</div>
          }
          @if (passwordSaved) {
            <div class="success">Password changed.</div>
          }
          <div class="form-actions">
            <button type="submit" class="btn-primary" [disabled]="savingPassword">
              {{ savingPassword ? 'Saving...' : 'Change Password' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
